<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 Love Date - Share Link</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap');
        * { margin:0;padding:0;box-sizing:border-box; }
        body {
            min-height:100vh;display:flex;justify-content:center;align-items:center;
            background:#fef0f4;font-family:'Nunito',sans-serif;padding:20px;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255,182,193,0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,218,233,0.3) 0%, transparent 50%);
        }
        .card {
            background:#fff;border-radius:28px;padding:40px 28px;text-align:center;
            box-shadow:0 8px 40px rgba(219,112,147,0.15);max-width:440px;width:100%;
        }
        .heart-top { font-size:50px;animation:beat 1.2s ease-in-out infinite;display:inline-block; }
        @keyframes beat {
            0%,100%{transform:scale(1)} 15%{transform:scale(1.3)} 30%{transform:scale(1)} 45%{transform:scale(1.15)}
        }
        h1 { font-family:'Pacifico',cursive;font-size:22px;color:#d4638a;margin:12px 0 4px; }
        .subtitle { font-size:13px;color:#b0738c;margin-bottom:18px; }

        /* QR Section */
        .section-label {
            font-size:13px;font-weight:700;color:#d4638a;text-transform:uppercase;
            letter-spacing:1px;margin-bottom:10px;
        }
        .qr-box {
            display:inline-block;background:#fef6f9;border:2.5px solid #f5d5e0;
            border-radius:20px;padding:16px;margin-bottom:22px;position:relative;
        }


        .divider {
            display:flex;align-items:center;gap:12px;margin-bottom:22px;
        }
        .divider::before,.divider::after { content:'';flex:1;height:1px;background:#f5d5e0; }
        .divider span { font-size:13px;color:#c4a0b0;font-weight:600;white-space:nowrap; }

        /* Short link */
        .short-link-box {
            background:#fef6f9;border:2px solid #f5d5e0;border-radius:14px;
            padding:14px 16px;margin-bottom:14px;position:relative;
            display:flex;align-items:center;gap:10px;
        }
        .short-link-box .link-text {
            flex:1;font-size:15px;font-weight:700;color:#d4638a;
            word-break:break-all;text-align:left;min-width:0;
        }
        .short-link-box .link-text a {
            color:#d4638a;text-decoration:none;
        }
        .short-link-box .link-text a:hover { text-decoration:underline; }
        .btn-copy-sm {
            background:#fce4ec;border:2px solid #f5c2d0;border-radius:50px;
            padding:8px 16px;font-size:12px;font-weight:700;color:#d4638a;
            cursor:pointer;font-family:'Nunito',sans-serif;transition:all 0.2s;
            white-space:nowrap;flex-shrink:0;
        }
        .btn-copy-sm:hover { background:#f8d0dd;border-color:#e8789a; }
        .btn-copy-sm:active { transform:scale(0.95); }
        .btn-copy-sm.copied { background:#e8789a;color:#fff;border-color:#e8789a; }

        /* Original link */
        .original-box {
            background:#fef6f9;border:1.5px dashed #f5d5e0;border-radius:12px;
            padding:10px 14px;margin-bottom:18px;cursor:pointer;transition:border-color 0.3s;
        }
        .original-box:hover { border-color:#e8789a; }
        .original-box .label { font-size:11px;color:#c4a0b0;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px; }
        .original-box .url { font-size:12px;color:#8c5a6e;word-break:break-all; }

        /* Toast */
        .toast {
            position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
            background:#e8789a;color:#fff;padding:10px 24px;border-radius:50px;
            font-size:14px;font-weight:700;opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;
        }
        .toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

        /* Loading */
        .loading { color:#b0738c;font-size:14px;font-weight:600; }

        @media (max-width:400px) {
            .card { padding:28px 18px; }
            h1 { font-size:19px; }
            .short-link-box .link-text { font-size:13px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart-top">💖</div>
        <h1>Our Love Date</h1>
        <p class="subtitle">Share this link with your special someone</p>

        <!-- QR Code -->
        <div class="section-label">📱 Scan QR Code</div>
        <div class="qr-box"></div>

        <div class="divider"><span>or</span></div>

        <!-- Short link -->
        <div class="section-label">🔗 Short Link</div>
        <div class="short-link-box" id="shortBox">
            <div class="link-text" id="shortLink"><span class="loading">Generating...</span></div>
            <button class="btn-copy-sm" id="btnCopy" onclick="copyShort()">Copy</button>
        </div>

        <!-- Original link -->
        <div class="original-box" onclick="copyOriginal()">
            <div class="label">Original link</div>
            <div class="url">https://qdo242.github.io/date_chip_iu/</div>
        </div>

        <p style="font-size:11px;color:#d4b0c0;">Tap anything to copy</p>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
    const ORIGINAL = 'https://qdo242.github.io/date_chip_iu/';

    // ========== QR Code via API (server-side rendering) ==========
    function drawQR(){
        const qrBox=document.querySelector('.qr-box');
        const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(ORIGINAL)+'&color=e8789a&bgcolor=fff&margin=10&format=png';
        const img=document.createElement('img');
        img.src=qrUrl;
        img.alt='QR Code';
        img.style.cssText='display:block;border-radius:8px;';
        img.onerror=function(){
            img.style.cssText='display:none;';
            const fallback=document.createElement('div');
            fallback.style.cssText='padding:30px;color:#d4638a;font-size:14px;font-weight:700;';
            fallback.textContent='QR Code - Open in browser to see';
            qrBox.appendChild(fallback);
        };
        qrBox.appendChild(img);
    }
    drawQR();

    // ========== Short link via TinyURL ==========
    async function getShortLink(){
        try{
            const resp=await fetch('https://tinyurl.com/api-create.php?url='+encodeURIComponent(ORIGINAL));
            const text=await resp.text();
            if(text.startsWith('http')){
                document.getElementById('shortLink').innerHTML='<a href="'+text+'" target="_blank">'+text+'</a>';
                window.shortUrl=text;
            }else{
                document.getElementById('shortLink').innerHTML='<a href="'+ORIGINAL+'" target="_blank">'+ORIGINAL+'</a>';
                window.shortUrl=ORIGINAL;
            }
        }catch(e){
            // Fallback: try is.gd
            try{
                const resp2=await fetch('https://is.gd/create.php?format=simple&url='+encodeURIComponent(ORIGINAL));
                const text2=await resp2.text();
                if(text2.startsWith('http')){
                    document.getElementById('shortLink').innerHTML='<a href="'+text2+'" target="_blank">'+text2+'</a>';
                    window.shortUrl=text2;
                }else{
                    document.getElementById('shortLink').innerHTML='<a href="'+ORIGINAL+'" target="_blank">'+ORIGINAL+'</a>';
                    window.shortUrl=ORIGINAL;
                }
            }catch(e2){
                document.getElementById('shortLink').innerHTML='<a href="'+ORIGINAL+'" target="_blank">'+ORIGINAL+'</a>';
                window.shortUrl=ORIGINAL;
            }
        }
    }
    getShortLink();

    // ========== Copy functions ==========
    function showToast(msg){
        const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),1500);
    }
    function copyShort(){
        const url=window.shortUrl||ORIGINAL;
        navigator.clipboard.writeText(url).then(()=>{
            showToast('Copied!');
            const btn=document.getElementById('btnCopy');
            btn.textContent='Copied!';btn.classList.add('copied');
            setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1500);
        }).catch(()=>showToast('Copy failed'));
    }
    function copyOriginal(){
        navigator.clipboard.writeText(ORIGINAL).then(()=>showToast('Copied!'));
    }
    </script>
</body>
</html>
